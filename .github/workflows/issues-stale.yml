# Warn waiting user reports after 21 quiet days and close them 14 days later.
# Only needs-retest or awaiting-response issues qualify; PRs are exempt.
name: Issues -- stale sweep

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          any-of-issue-labels: 'needs-retest,awaiting-response'
          days-before-issue-stale: 21
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: >
            This report is waiting on a response (see the comment above). It will close automatically in
            14 days if there's no update -- a one-line reply keeps it open.
          close-issue-message: >
            Closed automatically: no response. If this is still an issue on the current version, please
            send a fresh report from the in-app feedback dialog (or comment here) and it will be looked
            at again.
          days-before-pr-stale: -1
          days-before-pr-close: -1
          operations-per-run: 100
