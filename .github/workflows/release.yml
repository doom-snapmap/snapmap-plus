# Build and publish the DLL bundle, installer and bootstrapper on version tags.
# Maintainers must review and merge the changelog entry before tagging.
# Pin actions to commit SHAs and attest the downloadable artifacts.
# See docs/contributing.md for the release procedure.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the GitHub Release
  id-token: write       # OIDC token used to sign the build-provenance attestation
  attestations: write   # record the provenance attestation for the published artifacts

jobs:
  release:
    # Pin the runner family and MSVC toolset; /Brepro removes PE timestamps.
    # Other runner dependencies can still change, so verify reproducibility separately.
    runs-on: windows-2022
    env:
      # Both DLL build scripts read this toolset version. If the runner removes it,
      # select a supported version from the build error and validate the new output.
      SNAPMAPPLUS_VCVARS_VER: '14.44.35207'
    steps:
      - name: Keep the final 2018 release intact
        shell: bash
        run: |
          # v0.2.1-beta.19 is the last release for the 2018 DOOM build; installers
          # download it by tag for that build. This workflow must never rebuild,
          # replace or delete it (see docs/packaging.md).
          if [ "$GITHUB_REF_NAME" = "v0.2.1-beta.19" ]; then
            echo "refusing to republish the final 2018 release v0.2.1-beta.19" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read this release's notes
        shell: bash
        run: |
          # Require reviewed notes before building. The parser writes UTF-8 itself
          # to avoid shell-redirection encoding differences.
          set -euo pipefail
          python tools/changelog.py --section "$GITHUB_REF_NAME" --out notes.md
          cat notes.md
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21'
      - name: Fetch the final 2018 release's bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every bundle carries v0.2.1-beta.19's two files byte for byte. Installers without
          # build detection (v0.2.1-beta.19 and earlier) install every file a bundle lists, so a
          # 2018 player's update through them leaves the 2018 files in place (docs/packaging.md).
          set -euo pipefail
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.1-beta.19" \
            --jq '.assets[] | select(.name == "snapmap-plus-bundle.zip") | .digest')
          case "$digest" in
            sha256:*) ;;
            *) echo "v0.2.1-beta.19 publishes no digest for snapmap-plus-bundle.zip" >&2; exit 1 ;;
          esac
          gh release download v0.2.1-beta.19 --repo "$GITHUB_REPOSITORY" \
            --pattern snapmap-plus-bundle.zip --output legacy-bundle.zip
          echo "LEGACY_BUNDLE_SHA256=${digest#sha256:}" >> "$GITHUB_ENV"
      - name: Build + package
        shell: pwsh
        run: |
          # Scripts throw on failure; cmdlet-only scripts may leave LASTEXITCODE unset.
          # package.ps1 checks the 2018 bundle against the published digest and its manifest.
          $ErrorActionPreference = 'Stop'
          .\build.ps1
          .\package.ps1 -LegacyBundle legacy-bundle.zip -LegacyBundleSha256 $env:LEGACY_BUNDLE_SHA256
      - name: Build installer (version-stamped, with version resource + manifest)
        shell: pwsh
        working-directory: installer
        run: |
          # Embed Windows metadata, strip symbols and local paths, and stamp the tag.
          .\build.ps1 -Version "${{ github.ref_name }}" -Out ..\dist\snapmap-plus.exe
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      # A future signing step belongs after compilation and before packaging and
      # attestation, so the published hashes cover the signed artifacts.
      - name: Zip the overlay
        shell: pwsh
        run: |
          # Bundle the 2024 DLLs, the 2018 release's two files and the manifest; publish the
          # installer separately.
          Compress-Archive -Force -DestinationPath snapmap-plus-bundle.zip `
            -Path dist\XINPUT1_4.dll, dist\XINPUT1_3.dll, dist\snapmap-plus, dist\MANIFEST.sha256, dist\snapmap-plus-store.exe, dist\TOOLS.sha256
      - name: Zip the debug symbols (maintainer artifact)
        shell: pwsh
        run: |
          # Publish PDB/MAP files separately for crash symbolization. Keep them out
          # of dist and MANIFEST.sha256 so the installer does not deploy them.
          $ErrorActionPreference = 'Stop'
          $syms = @("build\XINPUT1_4.pdb", "build\XINPUT1_4.map",
                    "build\webview\snapmap-plus-ui.pdb", "build\webview\snapmap-plus-ui.map")
          foreach ($s in $syms) { if (-not (Test-Path $s)) { throw "missing symbol artifact: $s" } }
          Compress-Archive -Force -DestinationPath snapmap-plus-symbols.zip -Path $syms
      - name: Attest build provenance (the published artifacts)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Attest the downloadable bundle and installer.
          subject-path: |
            snapmap-plus-bundle.zip
            dist/snapmap-plus.exe
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Hyphenated tags are prereleases. Default installs prefer stable releases,
          # falling back to beta only while no stable exists.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            snapmap-plus-bundle.zip
            dist/snapmap-plus.exe
            installer/install.ps1
            snapmap-plus-symbols.zip
          body_path: notes.md

# Automatic re-porting after a DOOM update is not implemented.
