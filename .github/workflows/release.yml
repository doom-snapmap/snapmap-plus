# Build and publish a release on a version tag. Maintainers review and merge the changelog entry
# before tagging (docs/contributing.md, "Cutting a release").
# The tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N on a commit of main; the full CI
# runs on it first. The release is created as a draft, every asset is uploaded and read back, and
# only then is it published, so the latest release never lacks its downloads.
# Pin actions to commit SHAs and attest the downloadable artifacts.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag shape, main ancestry, reviewed notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "::error::$TAG is not a release tag: expected v1.2.3 or v1.2.3-beta.4"
            exit 1
          fi
          # v0.2.1-beta.19 is the last release for the 2018 DOOM build; installers download it by
          # tag for that build. This workflow must never rebuild, replace or delete it
          # (docs/packaging.md).
          if [ "$TAG" = "v0.2.1-beta.19" ]; then
            echo "::error::refusing to republish the final 2018 release v0.2.1-beta.19"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on main; tag a merged commit"
            exit 1
          fi
          python3 tools/changelog.py --section "$TAG" --out notes.md

  ci:
    name: CI
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: [validate, ci]
    # Pin the runner family and MSVC toolset; /Brepro removes PE timestamps.
    # Other runner dependencies can still change, so verify reproducibility separately.
    runs-on: windows-2022
    permissions:
      contents: write       # create, fill and publish the GitHub Release
      id-token: write       # OIDC token used to sign the build-provenance attestation
      attestations: write   # record the provenance attestation for the published artifacts
    env:
      # Both DLL build scripts read this toolset version. If the runner removes it,
      # select a supported version from the build error and validate the new output.
      SNAPMAPPLUS_VCVARS_VER: '14.44.35207'
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read this release's notes
        shell: bash
        run: |
          # The parser writes UTF-8 itself to avoid shell-redirection encoding differences, and
          # refuses an entry that still needs writing.
          set -euo pipefail
          python tools/changelog.py --section "$TAG" --out notes.md
          cat notes.md
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Build the DLLs and the store tool (version-stamped)
        shell: pwsh
        run: |
          # Scripts throw on failure; cmdlet-only scripts may leave LASTEXITCODE unset.
          $ErrorActionPreference = 'Stop'
          .\build.ps1 -Version $env:TAG
      - name: Build the installer (version-stamped, with version resource + manifest)
        shell: pwsh
        working-directory: installer
        run: |
          # Embed Windows metadata, strip symbols and local paths, and stamp the tag.
          .\build.ps1 -Version $env:TAG -Out ..\build\snapmap-plus.exe
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      # CODE SIGNING -- DISABLED until a signing account exists. Signing must run here: after
      # compilation, before package.ps1 hashes the DLLs into MANIFEST.sha256 and before the hashes
      # and attestation below, so every published hash covers the signed bytes. To enable it, set
      # the repository variables and secrets named below, replace `if: false` with
      # `if: vars.SIGNING_ENDPOINT != ''`, and keep the file list in step with package.ps1.
      - name: Sign the binaries (disabled)
        if: false
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}             # e.g. https://<region>.codesigning.azure.net
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}               # the signing account name
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}               # the certificate profile name
          AZURE_TENANT_ID: ${{ secrets.SIGNING_AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.SIGNING_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.SIGNING_AZURE_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name TrustedSigning -Scope CurrentUser -Force
          Invoke-TrustedSigning -Endpoint $env:SIGNING_ENDPOINT -CodeSigningAccountName $env:SIGNING_ACCOUNT `
            -CertificateProfileName $env:SIGNING_PROFILE -FileDigest SHA256 `
            -TimestampRfc3161 http://timestamp.acs.microsoft.com -TimestampDigest SHA256 `
            -Files "build\XINPUT1_4.dll,build\webview\snapmap-plus-ui.dll,build\snapmap-plus-store.exe,build\snapmap-plus.exe"

      - name: Package and check the overlay
        shell: pwsh
        run: |
          # The bundle carries the April 2024 pair only (docs/packaging.md#the-bundle).
          $ErrorActionPreference = 'Stop'
          .\package.ps1
          .\tools\bundle_guard.ps1
          Copy-Item build\snapmap-plus.exe dist\snapmap-plus.exe
      - name: Zip the overlay
        shell: pwsh
        run: |
          # Bundle the April 2024 pair, the manifest and the store tool; publish the installer
          # separately.
          Compress-Archive -Force -DestinationPath snapmap-plus-bundle.zip `
            -Path dist\XINPUT1_4.dll, dist\snapmap-plus, dist\MANIFEST.sha256, dist\snapmap-plus-store.exe, dist\TOOLS.sha256
      - name: Zip the debug symbols (maintainer artifact)
        shell: pwsh
        run: |
          # Publish PDB/MAP files separately for crash symbolization. Keep them out
          # of dist and MANIFEST.sha256 so the installer does not deploy them.
          $ErrorActionPreference = 'Stop'
          $syms = @("build\XINPUT1_4.pdb", "build\XINPUT1_4.map",
                    "build\webview\snapmap-plus-ui.pdb", "build\webview\snapmap-plus-ui.map")
          foreach ($s in $syms) { if (-not (Test-Path $s)) { throw "missing symbol artifact: $s" } }
          Compress-Archive -Force -DestinationPath snapmap-plus-symbols.zip -Path $syms
      - name: Attest build provenance (the published artifacts)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Attest the downloadable bundle and installer.
          subject-path: |
            snapmap-plus-bundle.zip
            dist/snapmap-plus.exe
      - name: Create the release as a draft and upload every asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Hyphenated tags are prereleases. Installers choose the newest release by version.
          kind=()
          case "$TAG" in *-*) kind=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${kind[@]}" \
            --title "$TAG" --notes-file notes.md \
            snapmap-plus-bundle.zip dist/snapmap-plus.exe installer/install.ps1 snapmap-plus-symbols.zip
      - name: Read every asset back and compare it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify
          for f in snapmap-plus-bundle.zip dist/snapmap-plus.exe installer/install.ps1 snapmap-plus-symbols.zip; do
            want=$(sha256sum "$f" | cut -d' ' -f1)
            got=$(sha256sum "verify/$(basename "$f")" | cut -d' ' -f1)
            if [ "$want" != "$got" ]; then
              echo "::error::the uploaded $(basename "$f") differs from the built file; the release stays a draft"
              exit 1
            fi
          done
          echo "every asset matches"
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
