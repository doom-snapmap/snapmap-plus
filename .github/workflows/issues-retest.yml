# After a release, ask older user reports to retest and add needs-retest.
# Prereleases prompt beta reports only; stable releases prompt all older reports.
# The stale workflow handles unanswered prompts. Use only the scoped GITHUB_TOKEN.
name: Issues -- release retest

on:
  release:
    types: [published]

permissions:
  issues: write

jobs:
  retest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = context.payload.release.tag_name.replace(/^v/, '');
            const releaseIsPre = tag.includes('-');

            // semver compare (numeric core, then prerelease identifiers per the spec: a prerelease
            // precedes its release; numeric identifiers compare numerically and precede alphanumeric).
            function parseV(v) {
              const m = String(v).replace(/^v/, '').match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?/);
              return m ? { n: [+m[1], +m[2], +m[3]], pre: m[4] || null } : null;
            }
            function lt(a, b) {
              const A = parseV(a), B = parseV(b);
              if (!A || !B) return false;
              for (let i = 0; i < 3; i++) if (A.n[i] !== B.n[i]) return A.n[i] < B.n[i];
              if (!!A.pre !== !!B.pre) return !!A.pre;
              if (!A.pre) return false;
              const as = A.pre.split('.'), bs = B.pre.split('.');
              for (let i = 0; i < Math.max(as.length, bs.length); i++) {
                if (as[i] === undefined) return true;
                if (bs[i] === undefined) return false;
                const an = /^\d+$/.test(as[i]), bn = /^\d+$/.test(bs[i]);
                if (an && bn) { if (+as[i] !== +bs[i]) return +as[i] < +bs[i]; }
                else if (an !== bn) return an;
                else if (as[i] !== bs[i]) return as[i] < bs[i];
              }
              return false;
            }

            // The DOOM build a report came from, from its "- Game:" line. Reports filed before that
            // line existed came from v0.2.1-beta.19 or earlier, which only ran on the 2018 build.
            const LEGACY_LAST = '0.2.1-beta.19';
            const LEGACY_BUILD = '2642713', CURRENT_BUILD = '13954591';
            function reportBuild(body, version) {
              const g = String(body || '').match(/^- Game: (.*)$/m);
              if (g) {
                const b = g[1].match(/^DOOM 2016 build (\d+) \(/);
                return b ? b[1] : null;                          // "not attached" / unrecognized -> unknown
              }
              return version && !lt(LEGACY_LAST, version) ? LEGACY_BUILD : null;
            }
            // A release after v0.2.1-beta.19 supports only build 13954591; that one and older only 2642713.
            function releaseSupports(releaseTag, build) {
              return build === (lt(LEGACY_LAST, releaseTag) ? CURRENT_BUILD : LEGACY_BUILD);
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'user-report', per_page: 100,
            });
            let prompted = 0;
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const names = issue.labels.map(l => typeof l === 'string' ? l : l.name);
              if (names.includes('needs-retest')) continue;                 // already prompted
              if (releaseIsPre && !names.includes('beta')) continue;        // betas only prompt beta reports
              const m = (issue.body || '').match(/^- Version: (\S+)/m);
              if (!m || !lt(m[1], tag)) continue;
              // never ask for a retest on a game build this release does not run on
              if (!releaseSupports(tag, reportBuild(issue.body, m[1]))) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: 'A newer version (**v' + tag + '**) has been released since this was reported (on v' + m[1] + '). '
                    + 'If you can, please update and check whether this still happens -- a quick "still broken" or '
                    + '"fixed for me" comment is all that\'s needed. With no response, this report will eventually '
                    + 'close automatically.',
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                labels: ['needs-retest'],
              });
              prompted++;
            }
            core.info('release v' + tag + ': prompted ' + prompted + ' of ' + issues.length + ' open user reports');
