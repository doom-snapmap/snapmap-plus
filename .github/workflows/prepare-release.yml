# prepare-release.yml -- drafts one CHANGELOG.md entry, as a reviewed pull request.
#
# This is the ONLY workflow that holds ANTHROPIC_API_KEY and the only place the project
# spends money. workflow_dispatch is its only trigger, and dispatch requires repo write,
# so no fork can reach it (same property ci.yml relies on). Two jobs on purpose: `draft`
# holds the key and NO write permission; `propose` holds write permission and cannot read
# the key. The API key and `contents: write` never share a process.
#
# The key lives in the `changelog` GitHub Environment, whose deployment branch policy MUST
# be restricted to `main`. An environment defaults to "All branches", and dispatch lets the
# caller choose the ref -- the workflow file that RUNS is the one on the chosen ref, so
# without that policy a tampered workflow on a branch could read the key. The control that
# actually bounds the financial loss is a monthly spend limit on a dedicated Anthropic
# workspace, set in the Console. Both are documented in docs/services.md.
#
# Every third-party action is pinned to a full commit SHA with a version comment, as in
# ci.yml, release.yml and pages.yml. Do not replace a SHA with a tag.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to prepare, e.g. v0.2.2-beta.1'
        required: true

permissions: {}

concurrency:
  # Deliberately NOT keyed on the version: two maintainers preparing different versions
  # would both branch from the same base and both prepend to the top of the same file,
  # and if the later version merged first the changelog would be out of order.
  group: prepare-release
  cancel-in-progress: false

jobs:
  draft:
    name: Draft the entry
    runs-on: ubuntu-latest
    environment: changelog
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the version and resolve the comparison base
        id: base
        env:
          # Never interpolate ${{ inputs.* }} straight into a script: a quote in the
          # input would run as shell, in the job that can read the API key.
          VERSION: ${{ inputs.version }}
        run: |
          # Everything that could waste an API call happens HERE, before any spend.
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a valid tag. Expected v1.2.3 or v1.2.3-beta.4."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists -- prepare the entry before tagging."
            exit 1
          fi
          if python3 tools/changelog.py --has "$VERSION"; then
            echo "::error::CHANGELOG.md already has a section for $VERSION."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "changelog/$VERSION" >/dev/null 2>&1; then
            echo "::error::branch changelog/$VERSION already exists -- an entry is already open."
            exit 1
          fi

          case "$VERSION" in
            # A stable release rolls up its betas, so it compares against the last STABLE
            # tag. `git describe` exits non-zero when there is none -- and there is none
            # today, every tag so far is a beta -- so guard it or `set -e` kills the step.
            *-*) BASE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true) ;;
            *)   BASE=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' 2>/dev/null || true) ;;
          esac
          if [ -z "$BASE" ]; then
            echo "::warning::no comparison tag found; using the full history."
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the drafter's dependencies
        run: python3 -m pip install --require-hashes -r tools/requirements.txt

      - name: Draft the entry
        env:
          # Step-level, not job-level: no other step in this job sees the key.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERSION: ${{ steps.base.outputs.version }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          python3 tools/draft_changelog.py \
            --tag "$VERSION" --base "$BASE" \
            --out section.md --sources-out sources.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog-draft
          path: |
            section.md
            sources.md
          retention-days: 1

  propose:
    name: Open the pull request
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelog-draft

      - name: Prepend the entry and check it parses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          section = pathlib.Path("section.md").read_text(encoding="utf-8")
          # Insert after the file's intro, before the first existing section.
          i = text.find("\n## ")
          if i == -1:
              new = text.rstrip("\n") + "\n\n" + section
          else:
              new = text[:i + 1] + section + "\n" + text[i + 1:]
          path.write_text(new, encoding="utf-8", newline="\n")
          PY
          rm section.md
          # The entry must satisfy the grammar every consumer parses, or the release
          # that reads it fails after the tag has already been pushed.
          python3 tools/changelog.py --lint

      # continue-on-error, because opening the pull request is gated by an ORGANISATION policy this
      # workflow cannot see: Settings -> Actions -> General -> "Allow GitHub Actions to create and
      # approve pull requests". When that is off the action fails, but it has ALREADY pushed the
      # branch, so the draft is safe and the next step just tells the maintainer where it is.
      # The draft cost an API call; losing it to a settings checkbox would be the worst outcome.
      - name: Open the pull request
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: changelog/${{ inputs.version }}
          base: main
          title: 'changelog: ${{ inputs.version }}'
          commit-message: |
            Add the release notes for ${{ inputs.version }}

            The entry a player reads for this release, drafted from its commits
            and reviewed before it is published.
          body-path: sources.md
          delete-branch: true
          add-paths: CHANGELOG.md

      - name: Report where the draft ended up
        env:
          VERSION: ${{ inputs.version }}
          OUTCOME: ${{ steps.pr.outcome }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ] && [ -n "${PR_URL:-}" ]; then
            echo "::notice::Release notes ready for review: $PR_URL"
            exit 0
          fi
          BRANCH="changelog/$VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::warning::The draft is pushed to $BRANCH but no pull request was opened."
            echo "::warning::Enable Settings -> Actions -> General -> 'Allow GitHub Actions to"
            echo "::warning::create and approve pull requests' (it may be locked at the org level),"
            echo "::warning::or open it by hand:"
            echo "::warning::  ${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1"
            exit 0
          fi
          echo "::error::Neither a pull request nor the branch $BRANCH exists -- the draft was lost."
          exit 1
