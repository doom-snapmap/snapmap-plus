# Build and test pull requests and main without repository secrets. release.yml runs these same
# jobs on a tag before it builds anything.
# Keep pull_request rather than pull_request_target for untrusted fork code.
# Pin third-party actions to commit SHAs with readable version comments.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Allow maintainers to rerun validation without another commit.
  workflow_dispatch:
  # The release gate.
  workflow_call:

permissions:
  contents: read

jobs:
  guard:
    name: Security guard (secretless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
          else
            BASE='${{ github.event.before }}'
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
      - name: No new binaries
        run: |
          BASE='${{ steps.base.outputs.sha }}'
          ADDED=$(git diff --diff-filter=A --name-only "$BASE...HEAD")
          BAD=$(printf '%s\n' "$ADDED" | grep -Ei '\.(dll|exe|obj|lib|exp|pdb|ilk|bin|so|dylib|a|zip|7z)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::This PR adds binary file(s) -- forbidden; the source is the only deliverable, CI builds binaries:"
            printf '%s\n' "$BAD"
            exit 1
          fi
          echo "OK: no binary files added."
      - name: Capability-surface scan
        run: |
          BASE='${{ steps.base.outputs.sha }}'
          ADDED=$(git diff "$BASE...HEAD" -- 'src/**' 'installer/**' 'tools/**' | grep -E '^\+' | grep -v '^\+\+\+' || true)
          # Reject cross-process injection and boot-persistence APIs.
          # The mod patches only its own process.
          BLOCK='WriteProcessMemory|CreateRemoteThread|NtCreateThreadEx|RtlCreateUserThread|VirtualAllocEx|QueueUserAPC|CurrentVersion..Run|schtasks'
          BAD=$(printf '%s\n' "$ADDED" | grep -nEi "$BLOCK" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Capability-surface scan BLOCKED: new lines call code-injection / persistence APIs the"
            echo "::error::tool has no legitimate reason to use. If truly intended, a maintainer must justify it:"
            printf '%s\n' "$BAD"
            exit 1
          fi
          # Flag network, process-launch and registry-write APIs for review.
          # Installer reg/tasklist calls are expected.
          WARN='WinHttp|URLDownloadToFile|InternetOpen|WSAStartup|\bsocket\s*\(|CreateProcess|ShellExecute|WinExec|\bsystem\s*\(|RegSetValue'
          HITS=$(printf '%s\n' "$ADDED" | grep -nEi "$WARN" || true)
          if [ -n "$HITS" ]; then
            echo "::warning::Capability-surface scan flagged new lines for MANUAL review (network / process-spawn /"
            echo "::warning::registry): confirm each is a legitimate use before merging:"
            printf '%s\n' "$HITS"
          else
            echo "OK: no blocked APIs, and no flagged capability-surface APIs introduced."
          fi
      - name: Changelog grammar + parser tests
        run: |
          # Check changelog grammar before tagging. These parser and renderer tests
          # use no API credentials or optional drafting dependencies.
          python3 tools/changelog.py --lint
          python3 -m unittest discover -s tools/tests -t tools -v
      - name: Secret scan (gitleaks)
        # Use the pinned standalone gitleaks binary, checked against the SHA-256 GitHub records
        # for that release asset; fail the job when it finds a leak.
        run: |
          set -euo pipefail
          VER=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-git --source . --redact --no-banner --exit-code 1

  build:
    name: Build + test (Windows)
    # Build both DLLs and run the native, JavaScript and Worker checks. The scripts are the
    # local ones (build.ps1, run-tests.ps1); this job adds only caches and the guards.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Cache the WebView2 SDK
        # The pinned SDK version lives in src/ui/build.ps1, so that file keys the cache.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/webview2sdk
          key: webview2sdk-${{ hashFiles('src/ui/build.ps1') }}
      - name: Restore the build and test objects
        # Objects are reused by content: each carries a key over its flags, toolset, and the
        # path and text of its source and included files (tools/cbuild.ps1), so a restored
        # object is used only when its inputs are unchanged. Each run saves a new entry and
        # restores the newest one.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/obj
          key: build-obj-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-obj-${{ runner.os }}-
      - name: Build backend + frontend
        shell: pwsh
        run: |
          # Scripts throw on failure. A cmdlet-only script may leave LASTEXITCODE
          # unset, so do not use it as the build result.
          $ErrorActionPreference = 'Stop'
          .\build.ps1
      - name: Package the overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\package.ps1
      - name: Bundle guard (the April 2024 pair, Qt-free)
        shell: pwsh
        run: ./tools/bundle_guard.ps1
      - name: XInput ordinal parity (must match System32)
        shell: pwsh
        run: |
          $dumpbin = (Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
          $ex = & $dumpbin /exports build\XINPUT1_4.dll
          if (-not ($ex -match '(?m)^\s*2\s.*XInputGetState') -or -not ($ex -match '(?m)^\s*3\s.*XInputSetState')) {
            $ex | Write-Host
            throw "XInput ordinals must be 2=GetState, 3=SetState"
          }
          Write-Host "ordinals OK (2=GetState, 3=SetState)"
      - name: Native and JavaScript tests
        shell: pwsh
        run: |
          .\tests\run-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "C unit tests failed" }
      - name: Cache the Worker test dependency
        id: miniflare
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/worker-tests
          key: miniflare-${{ runner.os }}-${{ hashFiles('tools/worker-tests/package-lock.json') }}
      - name: Install the Worker test dependency
        # npm ci installs exactly the lockfile's versions and checks each package's integrity hash.
        if: steps.miniflare.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/worker-tests | Out-Null
          Copy-Item tools/worker-tests/package.json, tools/worker-tests/package-lock.json build/worker-tests
          npm ci --prefix build/worker-tests --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Worker test dependency installation failed" }
      - name: Worker runtime tests
        shell: pwsh
        run: |
          node tests/worker_runtime_test.js build/worker-tests/node_modules/miniflare
          if ($LASTEXITCODE -ne 0) { throw "Worker runtime tests failed" }

  installer:
    name: Installer (Windows)
    # gofmt, vet, test and build the installer, in parallel with the DLL build.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # The installer has no go.sum (stdlib only); the step below caches by go.mod and sources.
          cache: false
      - name: Cache the Go build and module caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-1.26-${{ hashFiles('installer/go.mod', 'installer/go.sum', 'installer/**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-1.26-
      - name: Installer -- gofmt + vet + test + build
        shell: pwsh
        working-directory: installer
        run: |
          $u = gofmt -l .
          if ($u) { throw "gofmt: these files need formatting: $u" }
          go vet ./...;   if ($LASTEXITCODE -ne 0) { throw "go vet failed" }
          go test ./...;  if ($LASTEXITCODE -ne 0) { throw "go test failed" }
          go build -o snapmap-plus.exe .; if ($LASTEXITCODE -ne 0) { throw "go build failed" }
